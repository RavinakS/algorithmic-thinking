<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donation Receipt</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Receipt Container */
      .receipt-card {
        background: #ffffff;
        width: 100%;
        max-width: 750px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      /* Base Input Styles */
      input,
      textarea {
        border: none;
        outline: none;
        background: transparent;
        font-family: inherit;
        color: #333333;
        width: 100%;
      }

      input:focus,
      textarea:focus {
        background-color: #f0f7ff;
        border-radius: 4px;
      }

      /* Header Section */
      .header {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 25px;
      }

      .logo-container {
        width: 65px;
        height: 65px;
        background-color: #124e66;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
      }

      .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .org-details {
        flex-grow: 1;
      }

      .org-title {
        font-size: 18px;
        font-weight: 700;
        color: #1a252c;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        text-transform: uppercase;
      }

      .org-info {
        font-size: 11px;
        color: #7a8a9e;
        line-height: 1.5;
      }

      /* Registration Banner */
      .reg-banner {
        background-color: #eaf4f4;
        border-radius: 4px;
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #124e66;
        margin-bottom: 25px;
      }

      .reg-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .reg-item label {
        font-weight: 600;
        white-space: nowrap;
      }

      .reg-item input {
        font-size: 11px;
        color: #124e66;
        font-weight: 700;
      }

      /* Title Block */
      .receipt-title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .receipt-title {
        font-size: 18px;
        font-weight: 700;
        color: #2c3e50;
        letter-spacing: 0.5px;
      }

      .thank-you {
        font-size: 11px;
        font-weight: 700;
        color: #0d8065;
        letter-spacing: 0.5px;
      }

      /* Form Fields Grid */
      .field-group {
        margin-bottom: 18px;
      }

      .field-label {
        font-size: 10px;
        font-weight: 600;
        color: #8c9ba5;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        display: block;
      }

      .field-input-wrap {
        border-bottom: 1px solid #e1e8ed;
        padding-bottom: 4px;
      }

      .field-input-wrap input,
      .field-input-wrap textarea {
        font-size: 13px;
        font-weight: 600;
        color: #111111;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: 2fr 1.5fr 1.5fr;
        gap: 20px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      /* Footer Section */
      .footer-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 30px;
      }

      .amount-box {
        border: 2px solid #124e66;
        background-color: #f2f7f9;
        border-radius: 8px;
        padding: 15px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 48%;
      }

      .amount-label {
        font-size: 12px;
        font-weight: 700;
        color: #556b78;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .amount-input-wrap {
        display: flex;
        align-items: center;
      }

      .amount-input {
        font-size: 22px;
        font-weight: 800;
        color: #0b2b3a;
      }

      .signature-box {
        width: 45%;
        text-align: center;
      }

      .sig-org-name {
        font-size: 12px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 35px;
      }

      .sig-line {
        border-top: 1px solid #e1e8ed;
        padding-top: 6px;
      }

      .sig-label {
        font-size: 11px;
        color: #8c9ba5;
      }
    </style>
  </head>
  <body>
    <div class="receipt-card">
      <!-- HEADER SECTION -->
      <div class="header">
        <div class="logo-container">
          <!-- Replace src with your logo image path or base64 URL -->
          <img
            id="org-logo"
            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='65' height='65' viewBox='0 0 65 65'><rect width='65' height='65' fill='%23124e66'/></svg>"
            alt="Logo"
          />
        </div>
        <div class="org-details">
          <input
            class="org-title"
            type="text"
            value="HAR HATH KALAM INDIA ASSOCIATION"
          />
          <textarea class="org-info" rows="2">
H.no 14, Street no.8, Gill Enclave, Alipur Road Behind Sant Nirankari Bhawan, Patiala-147004
8437833465 | info@harhathkalam.org</textarea
          >
        </div>
      </div>

      <!-- REGISTRATION BANNER -->
      <div class="reg-banner">
        <div class="reg-item">
          <label>Regd. No. -</label>
          <input type="text" value="UII, L046830" />
        </div>
        <div class="reg-item">
          <label>PAN No. -</label>
          <input type="text" value="AA" style="width: 40px" />
        </div>
        <div class="reg-item">
          <label>I.T. Ex. No. (80G No.) -</label>
          <input type="text" value="AAECH2" />
        </div>
      </div>

      <!-- TITLE BAR -->
      <div class="receipt-title-bar">
        <div class="receipt-title">DONATION RECEIPT</div>
        <div class="thank-you">THANK YOU FOR YOUR SUPPORT</div>
      </div>

      <!-- RECEIPT DETAILS (GRID 1) -->
      <div class="grid-3">
        <div class="field-group">
          <span class="field-label">Receipt No.</span>
          <div class="field-input-wrap">
            <input type="text" value="357" />
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">F.Y.</span>
          <div class="field-input-wrap">
            <input type="text" value="2026-27" />
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">Date</span>
          <div class="field-input-wrap">
            <input type="text" value="04-09-2026" />
          </div>
        </div>
      </div>

      <!-- DONOR NAME -->
      <div class="field-group">
        <span class="field-label">Received with thanks from</span>
        <div class="field-input-wrap">
          <input type="text" value="PETER" />
        </div>
      </div>

      <!-- ADDRESS -->
      <div class="field-group">
        <span class="field-label">Address</span>
        <div class="field-input-wrap">
          <input type="text" value="patiala punjab" />
        </div>
      </div>

      <!-- AMOUNT IN WORDS -->
      <div class="field-group">
        <span class="field-label">Rupees (in words)</span>
        <div class="field-input-wrap">
          <input type="text" value="One Hundred Rupees Only" />
        </div>
      </div>

      <!-- DONATION DETAILS (GRID 2) -->
      <div class="grid-3">
        <div class="field-group">
          <span class="field-label">On A/c. Of</span>
          <div class="field-input-wrap">
            <input type="text" value="Voluntary Donation" />
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">For</span>
          <div class="field-input-wrap">
            <input type="text" value="Support" />
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">Mode of Payment</span>
          <div class="field-input-wrap">
            <input type="text" value="Bank Transfer" />
          </div>
        </div>
      </div>

      <!-- PAYMENT DETAILS (GRID 3) -->
      <div class="grid-2">
        <div class="field-group">
          <span class="field-label">Donation Date</span>
          <div class="field-input-wrap">
            <input type="text" value="01-01-2026" />
          </div>
        </div>
        <div class="field-group">
          <span class="field-label">Payment Details</span>
          <div class="field-input-wrap">
            <input type="text" value="UCO" />
          </div>
        </div>
      </div>

      <!-- FOOTER SECTION -->
      <div class="footer-section">
        <div class="amount-box">
          <span class="amount-label">Amount:</span>
          <div class="amount-input-wrap">
            <input class="amount-input" type="text" value="₹ 100/-" />
          </div>
        </div>

        <div class="signature-box">
          <div class="sig-org-name">
            <input
              type="text"
              value="For Har Hath Kalam India Association"
              style="text-align: center; font-weight: 700; font-size: 12px"
            />
          </div>
          <div class="sig-line">
            <span class="sig-label">Authorised Signatory</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
