<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donation Receipt</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100vh;
        width: 100%;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
        overflow-x: hidden;
      }

      /* Receipt Container */
      .receipt-card {
        background: #ffffff;
        width: 100%;
        max-width: 700px;
        padding: 24px 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }

      /* Base Input & Editable Elements */
      input,
      textarea {
        border: none;
        outline: none;
        background: transparent;
        font-family: inherit;
        color: #333333;
        width: 100%;
        resize: none;
      }

      input:focus,
      textarea:focus {
        background-color: #f0f7ff;
        border-radius: 4px;
      }

      /* DESKTOP HEADER SECTION (Side-by-Side Layout) */
      .header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 14px;
      }

      .logo-container {
        width: 60px;
        height: 60px;
        background-color: #124e66;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
      }

      .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .org-details {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-grow: 1;
        min-width: 0;
      }

      .org-title {
        font-size: 15px;
        font-weight: 700;
        color: #1a252c;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .org-info {
        font-size: 10.5px;
        color: #7a8a9e;
        line-height: 1.35;
        height: 28px;
        white-space: pre-wrap;
      }

      /* Registration Banner */
      .reg-banner {
        background-color: #eaf4f4;
        border-radius: 4px;
        padding: 6px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10.5px;
        color: #124e66;
        margin-bottom: 14px;
      }

      .reg-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .reg-item label {
        font-weight: 600;
        white-space: nowrap;
      }

      .reg-item input {
        font-size: 10.5px;
        color: #124e66;
        font-weight: 700;
      }

      /* Title Bar */
      .receipt-title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .receipt-title {
        font-size: 15px;
        font-weight: 700;
        color: #2c3e50;
        letter-spacing: 0.5px;
      }

      .thank-you {
        font-size: 10px;
        font-weight: 700;
        color: #0d8065;
        letter-spacing: 0.5px;
      }

      /* Form Fields Grid */
      .field-group {
        margin-bottom: 10px;
      }

      .field-label {
        font-size: 9.5px;
        font-weight: 600;
        color: #8c9ba5;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
        display: block;
      }

      .field-input-wrap {
        border-bottom: 1px solid #e1e8ed;
        padding-bottom: 2px;
      }

      .field-input-wrap input,
      .field-input-wrap textarea {
        font-size: 12px;
        font-weight: 600;
        color: #111111;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: 2fr 1.5fr 1.5fr;
        gap: 12px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      /* Footer Section */
      .footer-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 16px;
        gap: 15px;
      }

      .amount-box {
        border: 2px solid #124e66;
        background-color: #f2f7f9;
        border-radius: 6px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 48%;
      }

      .amount-label {
        font-size: 11px;
        font-weight: 700;
        color: #556b78;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .amount-input-wrap {
        display: flex;
        align-items: center;
        width: 100%;
      }

      .amount-input {
        font-size: 18px;
        font-weight: 800;
        color: #0b2b3a;
      }

      .signature-box {
        width: 45%;
        text-align: center;
      }

      .sig-org-name {
        font-size: 11px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 20px;
      }

      .sig-line {
        border-top: 1px solid #e1e8ed;
        padding-top: 4px;
      }

      .sig-label {
        font-size: 10px;
        color: #8c9ba5;
      }

      /* MOBILE ONLY STYLES */
      @media (max-width: 600px) {
        body {
          padding: 8px;
        }

        .receipt-card {
          padding: 16px;
        }

        /* Stack Header Elements vertically for mobile */
        .header {
          flex-direction: column;
          align-items: center;
          text-align: center;
          margin-bottom: 16px;
          gap: 10px;
        }

        .org-details {
          align-items: center;
          width: 100%;
        }

        /*
          MOBILE ONLY:
          Allow the complete NGO name to wrap naturally.
          No ellipsis, clipping, or horizontal scrolling.
        */
        .org-title {
          display: block;
          width: 100%;
          height: auto;
          min-height: 0;

          text-align: center;
          white-space: normal;
          overflow: visible;
          text-overflow: clip;

          overflow-wrap: anywhere;
          word-break: break-word;

          font-size: 14px;
          line-height: 1.35;
          margin-bottom: 6px;
        }

        /*
          MOBILE ONLY:
          Allow the complete NGO address/contact information
          to occupy as many lines as required.
        */
        .org-info {
          display: block;
          width: 100%;
          height: auto;
          min-height: 0;

          text-align: center;
          white-space: normal;
          overflow: visible;

          overflow-wrap: anywhere;
          word-break: break-word;

          font-size: 10.5px;
          line-height: 1.4;
        }

        .grid-3,
        .grid-2 {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .reg-banner {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }

        .reg-item {
          width: 100%;
          justify-content: space-between;
        }

        .footer-section {
          flex-direction: column;
          align-items: stretch;
          gap: 16px;
        }

        .amount-box,
        .signature-box {
          width: 100%;
        }

        .sig-org-name {
          margin-bottom: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="receipt-card">
      <!-- HEADER SECTION -->
      <div class="header">
        <div class="logo-container">
          <img
            id="org-logo"
            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><rect width='60' height='60' fill='%23124e66'/></svg>"
            alt="Logo"
          />
        </div>

        <div class="org-details">
          <input
            class="org-title"
            type="text"
            value="HAR HATH KALAM INDIA ASSOCIATION"
          />

          <textarea class="org-info">
H.no 14, Street no.8, Gill Enclave, Alipur Road Behind Sant Nirankari Bhawan, Patiala-147004
8437833465 | info@harhathkalam.org</textarea
          >
        </div>
      </div>

      <!-- REGISTRATION BANNER -->
      <div class="reg-banner">
        <div class="reg-item">
          <label>Regd. No. -</label>
          <input type="text" value="UII, L046830" />
        </div>

        <div class="reg-item">
          <label>PAN No. -</label>
          <input type="text" value="AA" style="width: 35px" />
        </div>

        <div class="reg-item">
          <label>I.T. Ex. No. (80G No.) -</label>
          <input type="text" value="AAECH2" />
        </div>
      </div>

      <!-- TITLE BAR -->
      <div class="receipt-title-bar">
        <div class="receipt-title">DONATION RECEIPT</div>
        <div class="thank-you">THANK YOU FOR YOUR SUPPORT</div>
      </div>

      <!-- RECEIPT DETAILS (GRID 1) -->
      <div class="grid-3">
        <div class="field-group">
          <span class="field-label">Receipt No.</span>
          <div class="field-input-wrap">
            <input type="text" value="357" />
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">F.Y.</span>
          <div class="field-input-wrap">
            <input type="text" value="2026-27" />
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">Date</span>
          <div class="field-input-wrap">
            <input type="text" value="04-09-2026" />
          </div>
        </div>
      </div>

      <!-- DONOR NAME -->
      <div class="field-group">
        <span class="field-label">Received with thanks from</span>
        <div class="field-input-wrap">
          <input type="text" value="PETER" />
        </div>
      </div>

      <!-- ADDRESS -->
      <div class="field-group">
        <span class="field-label">Address</span>
        <div class="field-input-wrap">
          <input type="text" value="patiala punjab" />
        </div>
      </div>

      <!-- AMOUNT IN WORDS -->
      <div class="field-group">
        <span class="field-label">Rupees (in words)</span>
        <div class="field-input-wrap">
          <input type="text" value="One Hundred Rupees Only" />
        </div>
      </div>

      <!-- DONATION DETAILS (GRID 2) -->
      <div class="grid-3">
        <div class="field-group">
          <span class="field-label">On A/c. Of</span>
          <div class="field-input-wrap">
            <input type="text" value="Voluntary Donation" />
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">For</span>
          <div class="field-input-wrap">
            <input type="text" value="Support" />
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">Mode of Payment</span>
          <div class="field-input-wrap">
            <input type="text" value="Bank Transfer" />
          </div>
        </div>
      </div>

      <!-- PAYMENT DETAILS (GRID 3) -->
      <div class="grid-2">
        <div class="field-group">
          <span class="field-label">Donation Date</span>
          <div class="field-input-wrap">
            <input type="text" value="01-01-2026" />
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">Payment Details</span>
          <div class="field-input-wrap">
            <input type="text" value="UCO" />
          </div>
        </div>
      </div>

      <!-- FOOTER SECTION -->
      <div class="footer-section">
        <div class="amount-box">
          <span class="amount-label">Amount:</span>

          <div class="amount-input-wrap">
            <input class="amount-input" type="text" value="₹ 100/-" />
          </div>
        </div>

        <div class="signature-box">
          <div class="sig-org-name">
            <input
              type="text"
              value="For Har Hath Kalam India Association"
              style="text-align: center; font-weight: 700; font-size: 11px"
            />
          </div>

          <div class="sig-line">
            <span class="sig-label">Authorised Signatory</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
